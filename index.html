
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADIVINHE O NOME DAS BANDEIRAS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        }

        body {
            background-color: black;
            color: white;
            text-align: center;
            padding: 30px;
            min-height: 100vh;
        }

        #inicio {
            display: block;
        }

        #quiz,
        #resultado {
            display: none;
        }

        .title {
            color: white;
            font-size: 40px;
            margin: 20px;
        }

        p {
            font-size: 20px;
            margin: 15px;
        }

        #currentTime {
            font-size: 18px;
        }

        .imagemInicio {
            width: 250px;
            max-width: 90%;
            height: 160px;
            object-fit: contain;
            margin: 25px;
        }

        .botao {
            font-size: 22px;
            margin: 20px;
        }

        button {
            background-color: white;
            color: black;
            border: none;
            padding: 15px 25px;
            margin: 10px;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
            background-color: lightgray;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        #bandeira {
            width: 350px;
            height: 230px;
            object-fit: contain;
            background-color: white;
            border: 4px solid white;
            border-radius: 10px;
            margin: 25px;
        }

        #contador {
            font-size: 22px;
        }

        #alternativas {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 650px;
            margin: 20px auto;
        }

        .alternativa {
            width: 270px;
            background-color: white;
            color: black;
        }

        #mensagem {
            min-height: 35px;
            font-size: 23px;
        }

        #pontuacao {
            font-size: 21px;
        }

        #resultadoFinal {
            font-size: 30px;
            margin: 30px;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .title {
                font-size: 30px;
            }

            #bandeira {
                width: 90%;
                max-width: 350px;
                height: 210px;
            }

            .alternativa {
                width: 90%;
            }
        }
    </style>
</head>

<body>

    <div id="inicio">

        <h1 class="title">Bandeiras do Mundo</h1>

        <p>Adivinhe as bandeiras dos países do mundo.</p>

        <p id="currentTime"></p>

        <img src="bandeiras/flag.gif" class="imagemInicio" alt="Bandeira do Brasil">

        <h3 class="botao">Aperte o botão para começar o quiz:</h3>

        <button id="comecar">COMEÇAR QUIZ</button>
        <button id="voltar">VOLTAR</button>

    </div>

    <div id="quiz">

        <h1 class="title">Adivinhe a Bandeira</h1>

        <p id="contador"></p>

        <img id="bandeira" src="" alt="Bandeira do país misterioso">

        <h2>Qual é o país dessa bandeira?</h2>

        <div id="alternativas"></div>

        <p id="mensagem"></p>

        <p id="pontuacao">Pontuação: 0</p>

    </div>

    <div id="resultado">

        <h1 class="title">Fim do Quiz!</h1>

        <h2 id="resultadoFinal"></h2>

        <button id="reiniciar">JOGAR NOVAMENTE</button>
        <button id="voltarInicio">VOLTAR AO INÍCIO</button>

    </div>

    <script>
        const perguntas = [
            {
                bandeira: "bandeiras/tl.png",
                resposta: "Timor-Leste",
                alternativas: ["Zimbábue", "Timor-Leste", "Chile", "Bangladesh"]
            },
            {
                bandeira: "bandeiras/bf.png",
                resposta: "Burkina Faso",
                alternativas: ["Suriname", "Gana", "Burkina Faso", "Uganda"]
            },
            {
                bandeira: "bandeiras/lk.png",
                resposta: "Sri Lanka",
                alternativas: ["Comores", "Malawi", "Índia", "Sri Lanka"]
            },
            {
                bandeira: "bandeiras/bw.png",
                resposta: "Botsuana",
                alternativas: ["Estônia", "Botsuana", "Kiribati", "Letônia"]
            },
            {
                bandeira: "bandeiras/pw.png",
                resposta: "Palau",
                alternativas: ["Palau", "Nigéria", "San Marino", "Honduras"]
            },
            {
                bandeira: "bandeiras/ls.png",
                resposta: "Lesoto",
                alternativas: ["Serra Leoa", "Gabão", "Lesoto", "Cazaquistão"]
            },
            {
                bandeira: "bandeiras/sa.png",
                resposta: "Arábia Saudita",
                alternativas: ["Irã", "Turcomenistão", "Arábia Saudita", "Paquistão"]
            },
            {
                bandeira: "bandeiras/vn.png",
                resposta: "Vietnã",
                alternativas: ["Coreia do Norte", "Nova Zelândia", "Singapura", "Vietnã"]
            },
            {
                bandeira: "bandeiras/bb.png",
                resposta: "Barbados",
                alternativas: ["Barbados", "Nicarágua", "Chipre", "Bahamas"]
            },
            {
                bandeira: "bandeiras/az.png",
                resposta: "Azerbaijão",
                alternativas: ["Burundi", "Azerbaijão", "Andorra", "Somália"]
            }
        ];

        let perguntaAtual = 0;
        let pontos = 0;
        let respondida = false;

        const inicio = document.getElementById("inicio");
        const quiz = document.getElementById("quiz");
        const resultado = document.getElementById("resultado");

        const comecar = document.getElementById("comecar");
        const voltar = document.getElementById("voltar");
        const reiniciar = document.getElementById("reiniciar");
        const voltarInicio = document.getElementById("voltarInicio");

        const bandeira = document.getElementById("bandeira");
        const alternativas = document.getElementById("alternativas");
        const mensagem = document.getElementById("mensagem");
        const pontuacao = document.getElementById("pontuacao");
        const contador = document.getElementById("contador");
        const resultadoFinal = document.getElementById("resultadoFinal");

        function iniciarQuiz() {
            perguntaAtual = 0;
            pontos = 0;
            respondida = false;

            inicio.style.display = "none";
            resultado.style.display = "none";
            quiz.style.display = "block";

            mostrarPergunta();
        }

        function mostrarPergunta() {
            const pergunta = perguntas[perguntaAtual];

            respondida = false;

            mensagem.textContent = "";
            alternativas.innerHTML = "";

            bandeira.onerror = function() {
                mensagem.textContent = "Erro ao carregar a imagem: ";
            };

            bandeira.src = pergunta.bandeira;

            contador.textContent =
                "Pergunta " + (perguntaAtual + 1) +
                " de " + perguntas.length;

            pontuacao.textContent = "Pontuação: " + pontos;

            pergunta.alternativas.forEach(function(opcao) {
                const botao = document.createElement("button");

                botao.textContent = opcao;
                botao.classList.add("alternativa");

                botao.onclick = function() {
                    verificarResposta(opcao);
                };

                alternativas.appendChild(botao);
            });
        }

        function verificarResposta(resposta) {
            if (respondida) {
                return;
            }

            respondida = true;

            const respostaCorreta = perguntas[perguntaAtual].resposta;

            if (resposta === respostaCorreta) {
                pontos++;
                mensagem.textContent = "CORRETO!";
            } else {
                mensagem.textContent = "ERRADO! A resposta era " + respostaCorreta + ".";
            }

            pontuacao.textContent = "Pontuação: " + pontos;

            bloquearAlternativas();

            setTimeout(function() {
                perguntaAtual++;

                if (perguntaAtual < perguntas.length) {
                    mostrarPergunta();
                } else {
                    finalizarQuiz();
                }
            }, 1500);
        }

        function bloquearAlternativas() {
            const botoes = document.querySelectorAll(".alternativa");

            botoes.forEach(function(botao) {
                botao.disabled = true;
            });
        }

        function finalizarQuiz() {
            quiz.style.display = "none";
            resultado.style.display = "block";

            resultadoFinal.textContent =
                "Você acertou " + pontos +
                " de " + perguntas.length +
                " perguntas!";
        }

        function voltarParaInicio() {
            quiz.style.display = "none";
            resultado.style.display = "none";
            inicio.style.display = "block";
        }

        comecar.onclick = iniciarQuiz;
        reiniciar.onclick = iniciarQuiz;
        voltarInicio.onclick = voltarParaInicio;

        voltar.onclick = function() {
            window.history.back();
        };

        function atualizarHora() {
            const agora = new Date();

            const horas = String(agora.getHours()).padStart(2, "0");
            const minutos = String(agora.getMinutes()).padStart(2, "0");
            const segundos = String(agora.getSeconds()).padStart(2, "0");

            document.getElementById("currentTime").textContent =
                horas + ":" + minutos + ":" + segundos;
        }

        setInterval(atualizarHora, 1000);
        atualizarHora();
    </script>

</body>

</html>
